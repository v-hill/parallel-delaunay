[project]
name = "parallel-delaunay"
version = "1.0.0"
description = "Parallel implementation of Guibas & Stolfi's divide-and-conquer algorithm for Delaunay triangulation, using MPI in Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "v-hill", email = "67915924+v-hill@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.6.2",
    "mpi4py>=3.1.4",
    "numpy>=1.23.5",
    "scipy>=1.10.0",
]

[project.urls]
Repository = "https://github.com/v-hill/parallel-delaunay"

[dependency-groups]
dev = [
    "black",
    "pre-commit",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "paralleldelaunay"
module-root = ""

[tool.black]
line-length = 79
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 79
