[project]
name = "parallel-delaunay"
version = "2.0.1"
description = "Numba implementation of Guibas & Stolfi's divide-and-conquer algorithm for Delaunay triangulation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "v-hill", email = "67915924+v-hill@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.6.2",
    "numba>=0.61",
    "numpy>=1.23.5",
    "scipy>=1.10.0",
]

[project.urls]
Repository = "https://github.com/v-hill/parallel-delaunay"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest>=9.2.0",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "paralleldelaunay"
module-root = ""

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.isort]
profile = "black"
line_length = 79

[tool.pytest.ini_options]
testpaths = ["tests"]
